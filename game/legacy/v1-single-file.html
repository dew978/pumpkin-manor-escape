<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>호박 저택 탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=East+Sea+Dokdo&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 전체가 게임판. HUD는 위·아래 띠, 대화창은 가운데 양피지 한 장 */
:root {
  --night: #120d1a;      /* 바탕 */
  --plum: #241a33;       /* 패널 */
  --plum-2: #33264a;     /* 패널 강조 */
  --parchment: #efe3c8;  /* 글자 */
  --dim: #b4a6c4;        /* 보조 글자 */
  --pumpkin: #f08a24;    /* 강조 */
  --candle: #ffd27a;     /* 안전지대 */
  --mint: #8fe0c9;       /* 정답 */
  --blood: #e2556b;      /* 경고 */
  --ink: #1b1210;        /* 양피지 위 글자 */
  --paper: #eedfbf;      /* 양피지 */
  --paper-2: #e2cfa6;
  --f-display: "East Sea Dokdo", "Gowun Dodum", cursive;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-num: "Do Hyeon", "Gowun Dodum", "Malgun Gothic", sans-serif;
  --f-emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--night); color: var(--parchment); font-family: var(--f-body); overflow: hidden; touch-action: none; }
#app { position: fixed; inset: 0; }
#app > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#dark { pointer-events: none; }
#flash { position: absolute; inset: 0; pointer-events: none; background: var(--candle); opacity: 0; transition: opacity .6s; }

button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--candle); outline-offset: 2px; }

/* HUD */
#hud { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 12px;
  padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(var(--night), transparent); pointer-events: none; }
.room-name { font-family: var(--f-display); font-size: 34px; line-height: 1; color: var(--pumpkin); }
.room-sub { font-size: 13px; color: var(--dim); margin-top: 2px; }
#timer { font-family: var(--f-num); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; letter-spacing: .02em; }
#timer.low { color: var(--blood); animation: pulse 1s infinite; }
#timer small { display: block; font-family: var(--f-body); font-size: 12px; color: var(--dim); letter-spacing: 0; }
@keyframes pulse { 50% { opacity: .55; } }
.hud-right { justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#pieces { display: flex; gap: 6px; }
.pc { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-emoji); font-size: 22px;
  background: var(--plum); border: 2px solid var(--plum-2); position: relative; filter: grayscale(1) brightness(.5); }
.pc.got { filter: none; border-color: var(--pumpkin); }
.pc.solved { filter: none; border-color: var(--mint); }
.pc b { position: absolute; right: -6px; bottom: -6px; font-family: var(--f-num); font-size: 15px; font-weight: 400; background: var(--mint); color: var(--ink);
  border-radius: 8px; min-width: 20px; height: 20px; display: grid; place-items: center; }
#order { font-size: 13px; color: var(--dim); }
#order .sym { font-family: var(--f-emoji); font-size: 17px; letter-spacing: 2px; color: var(--parchment); }

#bottom { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap;
  padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); padding-top: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; }
#bottom > * { pointer-events: auto; }
.pocket { display: flex; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--plum); border: 2px solid var(--plum-2); font-size: 15px; }
.chip .e { font-family: var(--f-emoji); font-size: 18px; }
.chip.btn:hover:not(:disabled) { border-color: var(--pumpkin); }
.chip:disabled { opacity: .45; cursor: default; }
.chip kbd { font-family: var(--f-num); font-size: 12px; color: var(--dim); border: 1px solid var(--plum-2); border-radius: 4px; padding: 0 4px; }
#interact { font-family: var(--f-num); font-size: 22px; padding: 12px 24px; border-radius: 14px; background: var(--candle); color: var(--ink); border: 0;
  box-shadow: 0 0 0 4px rgba(255, 210, 122, .25), 0 0 30px rgba(255, 210, 122, .45); animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }

#toast { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); text-align: center;
  background: rgba(36, 26, 51, .92); border: 2px solid var(--plum-2); border-radius: 14px; padding: 10px 18px; font-size: 16px; line-height: 1.5;
  pointer-events: none; opacity: 0; transition: opacity .3s; }
#toast.show { opacity: 1; }

/* 화면과 대화창 */
.screen, .modal { position: absolute; inset: 0; display: grid; place-items: center; overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.modal { background: rgba(10, 6, 16, .62); }
#title { background: radial-gradient(ellipse at 50% 38%, rgba(240, 138, 36, .18), transparent 60%), rgba(12, 8, 18, .55); }
.title-wrap { text-align: center; max-width: 560px; display: grid; gap: 18px; justify-items: center; }
.logo { font-family: var(--f-display); font-size: clamp(64px, 16vw, 120px); line-height: .9; color: var(--pumpkin);
  text-shadow: 0 0 24px rgba(240, 138, 36, .5), 0 4px 0 #6b2f05; text-wrap: balance; }
.tagline { font-size: 17px; color: var(--parchment); line-height: 1.6; text-wrap: balance; }
.opts { display: grid; gap: 10px; width: 100%; max-width: 380px; }
.seg { display: grid; grid-template-columns: auto 1fr 1fr; align-items: center; gap: 6px; }
.seg span { font-size: 14px; color: var(--dim); min-width: 52px; text-align: left; }
.seg button { padding: 10px; border-radius: 10px; background: var(--plum); border: 2px solid var(--plum-2); font-size: 16px; }
.seg button[aria-pressed="true"] { border-color: var(--pumpkin); background: var(--plum-2); }
.big { font-family: var(--f-num); font-size: 26px; padding: 14px 44px; border-radius: 16px; border: 0; background: var(--pumpkin); color: var(--ink);
  box-shadow: 0 5px 0 #8a3f06; }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a3f06; }
.link { background: none; border: 0; color: var(--dim); text-decoration: underline; font-size: 14px; }
.keys { font-size: 13px; color: var(--dim); line-height: 1.7; }
.keys kbd { font-family: var(--f-num); color: var(--parchment); border: 1px solid var(--plum-2); border-radius: 4px; padding: 0 5px; }

.sheet { width: min(620px, 100%); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 26px 26px 22px;
  box-shadow: 0 0 0 6px #3b2a1c, 0 20px 60px rgba(0, 0, 0, .6); position: relative;
  background-image: repeating-linear-gradient(0deg, transparent 0 31px, rgba(120, 80, 30, .08) 31px 32px); }
.sheet h2 { font-family: var(--f-display); font-size: 44px; line-height: 1; font-weight: 400; margin: 0 0 6px; color: #7a2e06; text-wrap: balance; }
.sheet p { line-height: 1.7; margin: 0 0 12px; font-size: 17px; }
.sheet .lead { color: #5b4632; font-size: 15px; }
.sheet .story { font-size: 19px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 16px; }
.btn-ink { font-family: var(--f-num); font-size: 19px; padding: 10px 20px; border-radius: 10px; border: 2px solid var(--ink); background: var(--ink); color: var(--paper); }
.btn-ink.ghost { background: transparent; color: var(--ink); }
.btn-ink:disabled { opacity: .35; cursor: default; }
.orderbox { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border: 2px dashed #8a6a44; border-radius: 10px; margin: 8px 0 14px; font-size: 15px; }
.orderbox .sym { font-family: var(--f-emoji); font-size: 28px; letter-spacing: 6px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.card { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; border-radius: 10px; border: 2px solid #8a6a44; background: var(--paper-2); font-size: 15px; color: var(--ink); }
.card .e { font-family: var(--f-emoji); font-size: 34px; line-height: 1.1; }
.card.missing { opacity: .45; cursor: default; }
.card.solved { border-color: #2f8f74; background: #d7ead9; }
.card.solved strong { font-family: var(--f-num); font-size: 26px; font-weight: 400; }
.qtext { font-size: 22px; line-height: 1.6; margin: 6px 0 14px; text-wrap: pretty; }
.answer { display: flex; align-items: center; gap: 14px; justify-content: center; margin: 4px 0 12px; }
.slot { width: 58px; height: 66px; border-radius: 10px; border: 3px solid var(--ink); display: grid; place-items: center; font-family: var(--f-num); font-size: 38px; background: #fff7e6; }
.slot-col { display: grid; justify-items: center; gap: 4px; }
.slot-col .e { font-family: var(--f-emoji); font-size: 26px; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 420px; margin: 0 auto; }
.pad button { font-family: var(--f-num); font-size: 26px; padding: 10px 0; border-radius: 10px; border: 2px solid var(--ink); background: #fff7e6; color: var(--ink); }
.pad button:active { background: var(--paper-2); }
.hint { background: #fbeec8; border-left: 5px solid var(--pumpkin); padding: 8px 12px; border-radius: 4px; font-size: 16px; margin-top: 12px; }
.mapping { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 18px; margin-bottom: 10px; }
.mapping span { font-family: var(--f-num); }
.mapping .e { font-family: var(--f-emoji); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 10px 0 6px; }
.stat { border: 2px solid #8a6a44; border-radius: 10px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--f-num); font-size: 30px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: #5b4632; }
textarea#qjson { width: 100%; min-height: 300px; font: 13px/1.5 ui-monospace, Consolas, monospace; border: 2px solid var(--ink); border-radius: 8px; padding: 10px; background: #fff7e6; color: var(--ink); resize: vertical; }
.err { color: #a3132b; font-size: 14px; margin-top: 8px; min-height: 1em; }
.ctl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; margin: 10px 0; }
.ctl kbd { font-family: var(--f-num); border: 1px solid var(--ink); border-radius: 4px; padding: 0 5px; }

@media (max-width: 560px) {
  #hud { grid-template-columns: 1fr auto; }
  #hud .hud-left { grid-column: 1 / -1; }
  .room-name { font-size: 28px; }
  #timer { font-size: 32px; text-align: left; }
  .pc { width: 34px; height: 34px; font-size: 18px; }
  #toast { top: 128px; }
  .sheet { padding: 20px 16px 16px; }
  .sheet h2 { font-size: 36px; }
  .qtext { font-size: 19px; }
}
@media (prefers-reduced-motion: reduce) {
  #interact, #timer.low { animation: none; }
  .shake { animation: none; }
}
</style>

<div id="app">
  <canvas id="dark"></canvas>
  <div id="flash"></div>

  <header id="hud" hidden>
    <div class="hud-left">
      <div class="room-name" id="roomName">현관</div>
      <div class="room-sub" id="roomSub"></div>
    </div>
    <div id="timer">0:00<small>자정까지</small></div>
    <div class="hud-right">
      <div id="pieces"></div>
      <div id="order"></div>
    </div>
  </header>

  <div id="toast" role="status" aria-live="polite"></div>

  <div id="bottom" hidden>
    <div class="pocket">
      <button class="chip btn" id="useBell" title="박쥐 방울 쓰기"><span class="e">🔔</span><span id="bellN">0</span> <kbd>Q</kbd></button>
      <span class="chip"><span class="e">🍬</span><span id="candyN">0</span></span>
      <button class="chip btn" id="pauseBtn" title="잠깐 멈춤"><span class="e">⏸️</span></button>
      <button class="chip btn" id="muteBtn" title="소리 켜고 끄기"><span class="e" id="muteIcon">🔊</span></button>
    </div>
    <button id="interact" hidden>🕯️ 자물쇠 풀기 <small>(E)</small></button>
  </div>

  <section class="screen" id="title">
    <div class="title-wrap">
      <div class="logo">호박 저택<br>탈출</div>
      <p class="tagline">이름을 잃은 꼬마 유령 루미를 도와 주세요.<br>괴물을 피해 문제 조각을 모으고, 자물쇠를 풀어 저택을 빠져나가요.</p>
      <div class="opts">
        <div class="seg" id="segMode"><span>인원</span><button data-v="1" aria-pressed="false">혼자</button><button data-v="2" aria-pressed="true">둘이 협동</button></div>
        <div class="seg" id="segDiff"><span>괴물</span><button data-v="easy" aria-pressed="true">느릿느릿</button><button data-v="normal" aria-pressed="false">보통</button></div>
      </div>
      <button class="big" id="startBtn">들어가기</button>
      <p class="keys" id="keysHint"><kbd>W A S D</kbd> 1P · <kbd>방향키</kbd> 2P · 혼자일 땐 바닥을 눌러도 움직여요</p>
      <button class="link" id="editBtn">선생님: 문제 바꾸기</button>
    </div>
  </section>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  init() {

    let next = this.ctx.currentTime + 0.05;

  c.fillStyle = "#4a2a1a"; c.fillRect(0, 0, 64, 96);
  c.strokeStyle = "#2a160c"; c.lineWidth = 3; c.strokeRect(6, 6, 52, 40); c.strokeRect(6, 50, 52, 40);
  c.fillStyle = "#d8a84a"; c.beginPath(); c.arc(50, 52, 4, 0, 7); c.fill();
});
const faceTex = canvasTex(64, 64, (c) => {
  c.fillStyle = "#d8661a"; c.fillRect(0, 0, 64, 64); c.fillStyle = "#ffd27a";
  c.beginPath(); c.moveTo(18, 22); c.lineTo(28, 32); c.lineTo(14, 32); c.fill();
  c.beginPath(); c.moveTo(46, 22); c.lineTo(50, 32); c.lineTo(36, 32); c.fill();
  c.fillRect(18, 40, 28, 6);
});

function disposeGroup(grp) {
  grp.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
    mats.forEach(m => { if (m.map && m.map !== bookTex && m.map !== doorTex && m.map !== faceTex) m.map.dispose(); m.dispose(); });
  });
}

/* ---------- 방 불러오기 ---------- */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function loadRoom(idx) {
  if (roomGroup) { scene.remove(roomGroup); disposeGroup(roomGroup); }
  roomGroup = new THREE.Group(); scene.add(roomGroup);
  const R = ROOMS[idx]; G.roomIdx = idx; G.room = R;
  G.rows = R.map.length; G.cols = Math.max(...R.map.map(s => s.length));
  G.grid = []; G.pieces = []; G.items = []; G.monsters = []; G.lanterns = []; G.sign = null; G.door = null;
  const safeSet = new Set(), safeTiles = [], walls = [], shelves = [], graves = [], trees = [];
  for (let r = 0; r < G.rows; r++) {
    const row = [];
    for (let c = 0; c < G.cols; c++) {
      const ch = R.map[r][c] || "#";
      const cell = { ch, solid: SOLID.has(ch), safe: ch === "S" || ch === "P" };
      row.push(cell);
      if (cell.safe) { safeSet.add(r * G.cols + c); safeTiles.push({ c, r }); }
      if (ch === "P") G.spawn = { c, r };
      if (ch === "#") walls.push({ c, r });
      if (ch === "B") shelves.push({ c, r });
      if (ch === "G") graves.push({ c, r });
      if (ch === "W") trees.push({ c, r });
      if (ch === "J") G.lanterns.push({ c, r });
      if (ch === "D") G.door = { c, r };
      if (ch === "O") G.sign = { c, r, found: false };
      if (ch >= "1" && ch <= "4") G.pieces.push({ idx: +ch - 1, c, r, got: false, solved: false, wrong: 0, hinted: false });
      if (ch === "T" || ch === "C" || ch === "c") G.items.push({ kind: ch === "T" ? "time" : ch === "C" ? "bell" : "candy", c, r, taken: false });
      if (ch === "k" || ch === "p" || ch === "g") {
        const m = makeMonster(ch === "k" ? "skeleton" : ch === "p" ? "pumpkin" : "ghost");
        m.x = c; m.z = r; m.home = { c, r }; G.monsters.push(m); roomGroup.add(m.g);
      }
    }
    G.grid.push(row);
  }
  G.pieces.sort((a, b) => a.idx - b.idx);
  G.answers = G.pieces.map(p => QBANK[idx][p.idx].a);
  G.order = shuffle(G.pieces.map(p => p.idx));
  G.stats.candyTotal += G.items.filter(i => i.kind === "candy").length;

  // 바닥
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(G.cols, G.rows), new THREE.MeshLambertMaterial({ map: floorTexture(R.floor, safeSet) }));
  floor.rotation.x = -Math.PI / 2; floor.position.set((G.cols - 1) / 2, 0, (G.rows - 1) / 2); roomGroup.add(floor);
  G.floor = floor;

  // 벽 (카메라 쪽 가장자리는 낮게 해서 안이 보이게)
  const wallGeo = new THREE.BoxGeometry(1, 1, 1); wallGeo.translate(0, 0.5, 0);
  const wallMesh = new THREE.InstancedMesh(wallGeo, lam(0xffffff), walls.length);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  walls.forEach((w, i) => {
    const near = w.r === G.rows - 1 || w.c === G.cols - 1;
    const edge = w.r === 0 || w.c === 0 || near;
    const hgt = near ? 0.25 : edge ? 1.5 : 1.1;
    m4.makeScale(1, hgt, 1).setPosition(w.c, 0, w.r); wallMesh.setMatrixAt(i, m4);
    col.setHex(R.wall).multiplyScalar(0.85 + ((w.c * 7 + w.r * 3) % 5) * 0.06); wallMesh.setColorAt(i, col);
  });
  roomGroup.add(wallMesh);

  if (shelves.length) {
    const sg = new THREE.BoxGeometry(0.96, 1.3, 0.96); sg.translate(0, 0.65, 0);
    const sm = new THREE.InstancedMesh(sg, lam(0xffffff, { map: bookTex }), shelves.length);
    shelves.forEach((s, i) => { m4.makeTranslation(s.c, 0, s.r); sm.setMatrixAt(i, m4); });
    roomGroup.add(sm);
  }
  if (graves.length) {
    const gg = new THREE.BoxGeometry(0.62, 0.8, 0.22); gg.translate(0, 0.4, 0);
    const gm = new THREE.InstancedMesh(gg, lam(0x7d7a86), graves.length);
    graves.forEach((s, i) => { m4.makeRotationY(((s.c * 13 + s.r * 7) % 5 - 2) * 0.08).setPosition(s.c, 0, s.r); gm.setMatrixAt(i, m4); });
    roomGroup.add(gm);
    const cross = textSprite("R.I.P", { size: 34, font: '"Do Hyeon",sans-serif', color: "#2a2730", w: 128, h: 48, scale: 0.18 });
    graves.forEach(s => { const sp = cross.clone(); sp.position.set(s.c, 0.62, s.r + 0.13); roomGroup.add(sp); });
  }
  trees.forEach(t => {
    const tg = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.18, 1.4, 6), lam(0x2a1e1a)); trunk.position.y = 0.7;
    const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.06, 0.7, 5), lam(0x2a1e1a)); b1.position.set(0.22, 1.2, 0); b1.rotation.z = -0.9;
    const b2 = b1.clone(); b2.position.set(-0.2, 1.35, 0.05); b2.rotation.z = 0.8;
    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.42, 0), lam(0x2c2240)); crown.position.y = 1.55;
    tg.add(trunk, b1, b2, crown); tg.position.set(t.c, 0, t.r); tg.rotation.y = (t.c + t.r) * 0.7; roomGroup.add(tg);
  });
  G.lanterns.forEach((l, i) => {
    const jm = new THREE.Mesh(new THREE.SphereGeometry(0.32, 14, 10), new THREE.MeshLambertMaterial({ map: faceTex, emissive: 0xa04008, emissiveIntensity: 1 }));
    jm.scale.y = 0.8; jm.position.set(l.c, 0.28, l.r); jm.rotation.y = -Math.PI / 2 - Math.PI / 4; roomGroup.add(jm);
    if (decorLights[i]) decorLights[i].position.set(l.c, 1.0, l.r);
  });
  decorLights.forEach((l, i) => l.intensity = G.lanterns[i] ? 0.9 : 0);

  // 문
  const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.96, 1.5, 0.3), new THREE.MeshLambertMaterial({ map: doorTex, emissive: 0x1a0d06 }));
  doorMesh.position.set(G.door.c, 0.75, G.door.r + 0.3); roomGroup.add(doorMesh); G.doorMesh = doorMesh;
  const lockS = textSprite("🔒", { size: 80, scale: 0.55 }); lockS.position.set(G.door.c, 1.9, G.door.r + 0.3); roomGroup.add(lockS); G.lockSprite = lockS;

  // 촛불 원
  const sc = safeTiles.reduce((a, t) => ({ x: a.x + t.c / safeTiles.length, z: a.z + t.r / safeTiles.length }), { x: 0, z: 0 });
  G.safeCenter = sc;
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.25, 1.45, 48), new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0.55 }));
  ring.rotation.x = -Math.PI / 2; ring.position.set(sc.x, 0.02, sc.z); roomGroup.add(ring); G.ring = ring;
  [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(([a, b]) => {
    const cdl = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.26, 8), lam(0xf4ecd8)); cdl.position.set(sc.x + a, 0.13, sc.z + b);
    const fl = textSprite("🔥", { size: 80, scale: 0.26 }); fl.position.set(sc.x + a, 0.36, sc.z + b);
    roomGroup.add(cdl, fl);
  });
  altarLight.position.set(sc.x, 1.6, sc.z);

  // 조각
  G.pieces.forEach(p => {
    const s = SYMBOLS[p.idx];
    const sp = textSprite(s.e, { size: 78, scale: 0.62, bg: "rgba(255,240,200,.92)" });
    sp.position.set(p.c, 0.65, p.r); roomGroup.add(sp); p.mesh = sp;
    const glow = new THREE.Mesh(new THREE.CircleGeometry(0.42, 24), new THREE.MeshBasicMaterial({ color: s.color, transparent: true, opacity: 0.35 }));
    glow.rotation.x = -Math.PI / 2; glow.position.set(p.c, 0.03, p.r); roomGroup.add(glow); p.glow = glow;
  });
  // 아이템
  G.items.forEach(it => {
    const e = it.kind === "time" ? "⏳" : it.kind === "bell" ? "🔔" : "🍬";
    const sp = textSprite(e, { size: 84, scale: it.kind === "candy" ? 0.4 : 0.55 });
    sp.position.set(it.c, 0.5, it.r); roomGroup.add(sp); it.mesh = sp;
  });
  // 순서 표지판
  if (G.sign) {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.1, 6), lam(0x5a3a22)); post.position.set(G.sign.c, 0.55, G.sign.r); roomGroup.add(post);
    const hidden = textSprite("?", { size: 90, font: '"Do Hyeon",sans-serif', color: "#3b2a1c", w: 256, h: 96, scale: 0.5, bg: "#d8c49a" });
    hidden.position.set(G.sign.c, 1.35, G.sign.r); roomGroup.add(hidden); G.sign.mesh = hidden;
  }

  // 플레이어 위치
  const sp2 = [{ c: G.spawn.c, r: G.spawn.r }, { c: G.spawn.c + 1, r: G.spawn.r }];
  if (!isSafe(sp2[1].c, sp2[1].r)) sp2[1].c = G.spawn.c - 1;
  players.forEach((p, i) => {
    p.x = sp2[i].c; p.z = sp2[i].r; p.path = null; p.stunT = 0; p.invuln = 1; p.g.visible = i < G.players; p.stars.visible = false; p.g.rotation.set(0, 0, 0);
    playerLights[i].intensity = i < G.players ? 1.1 : 0;
  });
  ambient.color.setHex(R.ambient);
  G.time = R.time; G.confuseT = 0; G.roomElapsed = 0;
  G.doorOpenT = -1;
  camTarget.set(G.spawn.c, 0, G.spawn.r);

  // HUD
  document.getElementById("roomName").textContent = R.name;
  document.getElementById("roomSub").textContent = `${idx + 1} / ${ROOMS.length} · ${R.sub}`;
  renderPiecesHUD(); renderOrderHUD(); updatePocketHUD();
}

/* ---------- HUD ---------- */
const $ = id => document.getElementById(id);
function renderPiecesHUD() {
  $("pieces").innerHTML = G.pieces.map(p => {
    const s = SYMBOLS[p.idx];
    return `<div class="pc ${p.solved ? "solved" : p.got ? "got" : ""}" title="${s.name} 조각">${s.e}${p.solved ? `<b>${G.answers[G.pieces.indexOf(p)]}</b>` : ""}</div>`;
  }).join("");
}
function orderSyms() { return G.order.map(i => SYMBOLS[i].e).join(" "); }
function renderOrderHUD() {
  $("order").innerHTML = G.sign && G.sign.found ? `표지판 순서 <span class="sym">${orderSyms()}</span>` : "순서 표지판을 찾아보세요";
}
function updatePocketHUD() {
  $("bellN").textContent = G.bells; $("useBell").disabled = G.bells <= 0;
  $("candyN").textContent = G.stats.candy;
}
function fmt(t) { t = Math.max(0, Math.ceil(t)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; }
let toastTimer = 0;
function toast(msg, ms = 2800) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), ms);
}
function flash(op = 0.5) { const f = $("flash"); f.style.transition = "none"; f.style.opacity = op; setTimeout(() => { f.style.transition = "opacity .8s"; f.style.opacity = 0; }, 40); }
function tutorial(key, msg) { if (G.roomIdx !== 0 || G.tut[key]) return; G.tut[key] = true; toast(msg, 4200); }

/* ---------- 입력 ---------- */
const keys = new Set();
window.addEventListener("keydown", e => {
  if (e.target && e.target.tagName === "TEXTAREA") { if (e.code === "Escape") modalKey(e); return; }
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  if (!$("modal").hidden) {
    // Enter는 한 번만 처리: 창이 직접 다루지 않으면 초점 잡힌 버튼을 누른다
    if (e.code === "Enter" || e.code === "NumpadEnter") {
      e.preventDefault();
      const a = document.activeElement;
      if (modalKey(e) !== true && a && a.tagName === "BUTTON" && sheet.contains(a)) a.click();
      return;
    }
    modalKey(e); return;
  }
  if (G.mode !== "play") return;
  keys.add(e.code);
  if (e.code === "Escape") openPause();
  if (e.code === "KeyQ" || e.code === "Slash") useBell();
  if ((e.code === "KeyE" || e.code === "Enter" || e.code === "NumpadEnter") && !$("interact").hidden) openLock();
});
window.addEventListener("keyup", e => keys.delete(e.code));
window.addEventListener("blur", () => { keys.clear(); if (G.mode === "play") openPause(); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3();
renderer.domElement.addEventListener("pointerdown", e => {
  if (G.mode !== "play") return;
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (!ray.ray.intersectPlane(groundPlane, hit)) return;
  let t = tileOf(hit.x, hit.z);
  if (isSolid(t.c, t.r)) {
    const near = [[0, 1], [1, 0], [0, -1], [-1, 0]].map(([dc, dr]) => ({ c: t.c + dc, r: t.r + dr })).filter(n => !isSolid(n.c, n.r));
    if (!near.length) return; t = near[0];
  }
  const p = players[0]; if (p.stunT > 0) return;
  const path = bfs(tileOf(p.x, p.z), t, playerPass, 2000);
  if (path) p.path = path;
});

/* ---------- 갱신 ---------- */
const SCREEN_UP = { x: -Math.SQRT1_2, z: -Math.SQRT1_2 }, SCREEN_RIGHT = { x: Math.SQRT1_2, z: -Math.SQRT1_2 };
const playerActive = p => p.i < G.players && p.stunT <= 0 && p.invuln <= 0 && !isSafe(Math.round(p.x), Math.round(p.z));

function readInput(i) {
  const solo = G.players === 1;
  const up = i === 0 ? keys.has("KeyW") || (solo && keys.has("ArrowUp")) : keys.has("ArrowUp");
  const dn = i === 0 ? keys.has("KeyS") || (solo && keys.has("ArrowDown")) : keys.has("ArrowDown");
  const lf = i === 0 ? keys.has("KeyA") || (solo && keys.has("ArrowLeft")) : keys.has("ArrowLeft");
  const rt = i === 0 ? keys.has("KeyD") || (solo && keys.has("ArrowRight")) : keys.has("ArrowRight");
  const ix = (rt ? 1 : 0) - (lf ? 1 : 0), iy = (up ? 1 : 0) - (dn ? 1 : 0);
  let vx = SCREEN_RIGHT.x * ix + SCREEN_UP.x * iy, vz = SCREEN_RIGHT.z * ix + SCREEN_UP.z * iy;
  const l = Math.hypot(vx, vz); if (l > 0) { vx /= l; vz /= l; }
  return { vx, vz, any: l > 0 };
}

function updatePlayers(dt) {
  for (const p of players) {
    if (p.i >= G.players) continue;
    if (p.invuln > 0) p.invuln -= dt;
    if (p.stunT > 0) {
      p.stunT -= dt;
      p.stars.visible = true; p.g.rotation.z = 0.9;
      const other = players[1 - p.i];
      if (G.players === 2 && other.stunT <= 0 && dist2(p, other) < 0.85) {
        p.stunT = 0; p.invuln = 1.5; toast(`${other.i + 1}P가 ${p.i + 1}P를 깨웠어요!`); Sound.correct();
      } else if (p.stunT <= 0) {
        p.x = G.spawn.c + (p.i ? 1 : 0); p.z = G.spawn.r; if (isSolid(Math.round(p.x), Math.round(p.z))) p.x = G.spawn.c;
        p.invuln = 2; p.path = null;
      }
      if (p.stunT <= 0) { p.stars.visible = false; p.g.rotation.z = 0; }
      continue;
    }
    const inp = readInput(p.i);
    p.moving = false;
    if (inp.any) {
      p.path = null;
      slideMove(p, inp.vx * PLAYER_SPEED * dt, inp.vz * PLAYER_SPEED * dt, 0.28, playerPass);
      p.face = Math.atan2(inp.vx, inp.vz); p.moving = true;
    } else if (p.path && p.path.length) {
      p.moving = followPath(p, PLAYER_SPEED, dt);
    }
    if (p.moving) p.bob += dt * 12;

    // 줍기
    for (const pc of G.pieces) if (!pc.got && dist2(p, { x: pc.c, z: pc.r }) < 0.6) {
      pc.got = true; pc.mesh.visible = false; pc.glow.visible = false; Sound.play("pickup", 0.9);
      toast(`${SYMBOLS[pc.idx].e} ${SYMBOLS[pc.idx].name} 조각을 주웠어요!`); renderPiecesHUD();
      tutorial("piece", "조각의 문제는 문 앞 촛불 원 안에서 풀어요. 그곳엔 괴물이 못 들어와요.");
    }
    for (const it of G.items) if (!it.taken && dist2(p, { x: it.c, z: it.r }) < 0.6) {
      it.taken = true; it.mesh.visible = false; Sound.play("pickup", 0.6, it.kind === "candy" ? 1.4 : 1.1);
      if (it.kind === "time") { G.time += 30; toast("⏳ 모래시계! 시간 +30초"); }
      else if (it.kind === "bell") { G.bells++; toast(`🔔 박쥐 방울! ${G.players === 2 ? "Q(1P) 또는 /(2P)" : "Q"} 를 누르면 괴물이 8초 동안 헤매요`); }
      else { G.stats.candy++; }
      updatePocketHUD();
    }
    if (G.sign && !G.sign.found && dist2(p, { x: G.sign.c, z: G.sign.r }) < 1.8) revealSign();
  }
}

function revealSign() {
  G.sign.found = true;
  const m = G.sign.mesh; roomGroup.remove(m); m.material.map.dispose(); m.material.dispose();
  const shown = textSprite(orderSyms(), { size: 64, w: 360, h: 96, scale: 0.62, bg: "#d8c49a" });
  shown.position.set(G.sign.c, 1.35, G.sign.r); roomGroup.add(shown); G.sign.mesh = shown;
  Sound.play("pickup", 0.5, 0.8);
  toast(`표지판을 찾았어요: ${orderSyms()} — 이 순서가 자물쇠 번호 순서예요`, 4200);
  renderOrderHUD();
}

function nearestActive(m) {
  let best = null, bd = 1e9;
  for (const p of players) if (playerActive(p)) { const d = dist2(m, p); if (d < bd) { bd = d; best = p; } }
  return best ? { p: best, d: bd } : null;
}
function pickWander(m) {
  const t0 = tileOf(m.x, m.z);
  for (let k = 0; k < 10; k++) {
    const c = t0.c + Math.floor(Math.random() * 13) - 6, r = t0.r + Math.floor(Math.random() * 13) - 6;
    if (!monsterPass(c, r)) continue;
    const path = bfs(t0, { c, r }, monsterPass);
    if (path && path.length) { m.path = path; return; }
  }
  m.path = [];
}

function updateMonsters(dt) {
  const confused = G.confuseT > 0;
  for (const m of G.monsters) {
    m.anim += dt;
    m.bang.visible = m.state === "alert" || m.state === "chase";
    m.huh.visible = confused;
    if (m.restT > 0) { m.restT -= dt; continue; }

    if (m.type === "ghost") {
      const tgt = confused ? null : nearestActive(m);
      let dx, dz;
      if (tgt) { dx = tgt.p.x - m.x; dz = tgt.p.z - m.z; m.state = tgt.d < 3 ? "chase" : "wander"; }
      else { m.state = "wander"; dx = Math.sin(m.anim * 0.4); dz = Math.cos(m.anim * 0.3); }
      const d = Math.hypot(dx, dz) || 1, step = m.walk * dt * (confused ? 0.6 : 1);
      const nx = m.x + dx / d * step, nz = m.z + dz / d * step, t = tileOf(nx, nz);
      if (!isSafe(t.c, t.r) && t.c > 0 && t.r > 0 && t.c < G.cols - 1 && t.r < G.rows - 1) { m.x = nx; m.z = nz; }
      m.face = Math.atan2(dx, dz);
    } else {
      const tgt = confused ? null : nearestActive(m);
      if (confused && m.state !== "wander") { m.state = "wander"; m.path = []; }
      if (m.state === "wander") {
        if (!followPath(m, m.walk * (confused ? 1.3 : 1), dt)) pickWander(m);
        if (tgt && tgt.d < m.sight && (!m.needLOS || lineOfSight(m, tgt.p))) {
          m.state = "alert"; m.alertT = 0.6; m.target = tgt.p; m.path = []; m.lostT = 0;
          if (G.t - G.lastSpot > 2.5) { Sound.play("spotted", 0.7); G.lastSpot = G.t; }
          tutorial("spot", "호박귀신이 너희를 봤어요! 괴물은 너희보다 느려요. 멀리 도망가거나 촛불 원으로!");
        }
      } else if (m.state === "alert") {
        m.alertT -= dt; m.face = Math.atan2(m.target.x - m.x, m.target.z - m.z);
        if (m.alertT <= 0) { m.state = "chase"; m.repathT = 0; }
      } else if (m.state === "chase") {
        const p = m.target, d = dist2(m, p);
        const seen = !m.needLOS || lineOfSight(m, p);
        m.lostT = seen ? 0 : m.lostT + dt;
        if (!playerActive(p) || d > m.sight + 3 || m.lostT > 2.5) { m.state = "wander"; m.path = []; }
        else {
          m.repathT -= dt;
          if (m.repathT <= 0) { m.path = bfs(tileOf(m.x, m.z), tileOf(p.x, p.z), monsterPass) || []; m.repathT = 0.35; }
          if (m.path.length <= 1 && d < 1.6 && lineOfSight(m, p)) {
            const dx = p.x - m.x, dz = p.z - m.z, l = Math.hypot(dx, dz) || 1;
            slideMove(m, dx / l * m.run * dt, dz / l * m.run * dt, 0.25, monsterPass); m.face = Math.atan2(dx, dz);
          } else if (!followPath(m, m.run, dt)) { m.repathT = 0; }
        }
      }
    }
    // 잡기
    if (!confused) for (const p of players) if (playerActive(p) && dist2(m, p) < 0.55) {
      catchPlayer(p, m); m.restT = 2; m.state = "wander"; m.path = [];
    }
  }
}
function catchPlayer(p) {
  p.stunT = G.players === 2 ? 6 : 1.5; p.path = null; G.stats.catches++;
  Sound.play("caught", 0.9);
  const other = players[1 - p.i];
  if (G.players === 2 && other.stunT <= 0) toast(`${p.i + 1}P가 기절했어요! ${other.i + 1}P가 6초 안에 닿으면 깨어나요`);
  else if (G.players === 2) toast("둘 다 기절! 잠시 후 촛불 원에서 깨어나요");
  else toast("펑! 촛불 원으로 돌아가요");
}
function useBell() {
  if (G.mode !== "play" || G.bells <= 0) return;
  G.bells--; G.confuseT = 8; updatePocketHUD();
  Sound.tone([1568, 1319, 1568, 1319, 1760], { type: "triangle", gap: 0.07, dur: 0.18, vol: 0.12 });
  toast("🔔 딸랑딸랑! 괴물들이 8초 동안 어리둥절해요");
}
function midnight() {
  G.stats.midnights++; G.time += 60; flash(0.55); Sound.play("bell", 1);
  players.forEach((p, i) => { if (i < G.players) { p.x = G.spawn.c + (i ? 1 : 0); p.z = G.spawn.r; if (isSolid(Math.round(p.x), Math.round(p.z))) p.x = G.spawn.c; p.stunT = 0; p.invuln = 2; p.path = null; p.stars.visible = false; p.g.rotation.z = 0; } });
  toast("🔔 자정의 종이 울렸어요! 촛불 원으로 돌아왔지만, 모은 조각은 그대로예요. 시간 +60초", 4600);
}

function update(dt) {
  G.t += dt; G.roomElapsed += dt; G.stats.elapsed += dt;
  G.time -= dt;
  if (G.time <= 0) midnight();
  if (G.confuseT > 0) G.confuseT -= dt;
  updatePlayers(dt);
  updateMonsters(dt);

  const canLock = players.some(p => p.i < G.players && p.stunT <= 0 && isSafe(Math.round(p.x), Math.round(p.z)));
  $("interact").hidden = !canLock;
  if (canLock && G.pieces.some(p => p.got && !p.solved)) tutorial("lock", "촛불 원 안이에요. ‘자물쇠 풀기’를 눌러 문제를 풀어 보세요.");

  const tm = $("timer");
  tm.firstChild.nodeValue = fmt(G.time);
  tm.classList.toggle("low", G.time < 30);

  // 쫓기면 심장 소리
  G.heartT -= dt;
  const chased = G.monsters.some(m => m.state === "chase" && players.some(p => p.i < G.players && dist2(m, p) < 4));
  if (chased && G.heartT <= 0) { Sound.heart(); G.heartT = 0.9; }
}

/* 장식 애니메이션은 멈춤 중에도 돈다 */
function animate(dt, t) {
  for (const p of players) {
    p.g.position.set(p.x, p.moving && p.stunT <= 0 ? Math.abs(Math.sin(p.bob)) * 0.06 : 0, p.z);
    if (p.stunT <= 0) p.g.rotation.y += angleLerp(p.g.rotation.y, p.face, 0.25);
    p.stars.material.rotation = t * 3;
    playerLights[p.i].position.set(p.x + 0.2, 1.3, p.z + 0.2);
  }
  for (const m of G.monsters) {
    const float = m.type === "skeleton" ? 0 : Math.sin(m.anim * 2.4) * 0.08 + (m.type === "ghost" ? 0.15 : 0);
    m.g.position.set(m.x, float, m.z);
    m.g.rotation.y += angleLerp(m.g.rotation.y, m.face, 0.15);
    if (m.g.userData.legs) { const s = Math.sin(m.anim * 9) * 0.35; m.g.userData.legs[0].rotation.x = s; m.g.userData.legs[1].rotation.x = -s; }
    if (G.confuseT > 0) m.g.rotation.z = Math.sin(t * 6) * 0.15; else m.g.rotation.z = 0;
  }
  for (const pc of G.pieces) if (!pc.got) { pc.mesh.position.y = 0.65 + Math.sin(t * 2 + pc.c) * 0.08; pc.glow.material.opacity = 0.25 + Math.sin(t * 3 + pc.r) * 0.12; }
  for (const it of G.items) if (!it.taken) it.mesh.position.y = 0.5 + Math.sin(t * 2.4 + it.c * 2) * 0.06;
  if (G.ring) G.ring.material.opacity = 0.45 + Math.sin(t * 2) * 0.12;
  decorLights.forEach((l, i) => { if (G.lanterns[i]) l.intensity = 0.75 + Math.sin(t * 13 + i) * 0.08 + Math.sin(t * 7.3 + i * 2) * 0.1; });
  altarLight.intensity = 1.1 + Math.sin(t * 9) * 0.08;
  if (G.doorOpenT >= 0 && G.doorMesh) {
    G.doorOpenT += dt;
    G.doorMesh.position.y = 0.75 - Math.min(1, G.doorOpenT / 1.1) * 1.6;
  }
}
function angleLerp(a, b, k) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d * k; }

function updateCamera(dt) {
  const act = players.filter(p => p.i < G.players);
  const cx = act.reduce((s, p) => s + p.x, 0) / act.length, cz = act.reduce((s, p) => s + p.z, 0) / act.length;
  camTarget.x += (cx - camTarget.x) * Math.min(1, dt * 4);
  camTarget.z += (cz - camTarget.z) * Math.min(1, dt * 4);
  let want = 10.5;
  if (act.length === 2) want = Math.min(17, Math.max(10.5, dist2(act[0], act[1]) * 1.15 + 5));
  if (G.mode === "title") want = 12;
  viewSize += (want - viewSize) * Math.min(1, dt * 2);
  const aspect = window.innerWidth / window.innerHeight;
  const vs = aspect < 0.8 ? viewSize * 1.25 : viewSize;
  camera.top = vs / 2; camera.bottom = -vs / 2; camera.left = -vs * aspect / 2; camera.right = vs * aspect / 2;
  camera.updateProjectionMatrix();
  camera.position.copy(camTarget).add(CAM_OFFSET);
  camera.lookAt(camTarget);
}

/* ---------- 손전등 어둠 ---------- */
const dark = $("dark"), dctx = dark.getContext("2d");
const DS = 3; // 어둠 캔버스는 1/3 해상도
const proj = new THREE.Vector3();
function toScreen(x, y, z) { proj.set(x, y, z).project(camera); return { x: (proj.x + 1) / 2 * dark.width, y: (1 - proj.y) / 2 * dark.height }; }
function drawDark(t) {
  const w = dark.width, h = dark.height;
  dctx.globalCompositeOperation = "source-over";
  dctx.clearRect(0, 0, w, h);
  if (!G.room) return;
  dctx.fillStyle = `rgba(6,3,12,${G.room.dark})`; dctx.fillRect(0, 0, w, h);
  dctx.globalCompositeOperation = "destination-out";
  const pxPerTile = h / (camera.top - camera.bottom);
  const hole = (x, z, radTiles, strength = 1) => {
    const s = toScreen(x, 0.3, z), R = radTiles * pxPerTile;
    dctx.save(); dctx.translate(s.x, s.y); dctx.scale(1, ELEV_SIN);
    const g = dctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, `rgba(0,0,0,${strength})`); g.addColorStop(0.55, `rgba(0,0,0,${strength * 0.85})`); g.addColorStop(1, "rgba(0,0,0,0)");
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(0, 0, R, 0, Math.PI * 2); dctx.fill(); dctx.restore();
  };
  const flick = 1 + Math.sin(t * 11) * 0.02 + Math.sin(t * 5.7) * 0.02;
  for (const p of players) if (p.i < G.players) hole(p.x, p.z, G.room.light * flick * (p.stunT > 0 ? 0.6 : 1));
  if (G.safeCenter) hole(G.safeCenter.x, G.safeCenter.z, 2.6, 0.9);
  G.lanterns.forEach(l => hole(l.c, l.r, 1.5, 0.75));
  G.monsters.forEach(m => { if (m.type === "pumpkin") hole(m.x, m.z, 0.9, 0.6); });
  if (G.doorOpenT >= 0 && G.door) hole(G.door.c, G.door.r + 1, 3, 1);
}

/* 자물쇠 */
let L = null;
function openLock() {
  if (G.mode !== "play") return;

  renderLock();
}
function renderLock() {
  if (L.view === "list") {
    const allSolved = G.pieces.every(p => p.solved), signOk = G.sign && G.sign.found;
    const cards = G.pieces.map((p, k) => {
      const s = SYMBOLS[p.idx];
      if (!p.got) return `<button class="card missing" disabled><span class="e">${s.e}</span>아직 못 찾음</button>`;
      if (p.solved) return `<button class="card solved" disabled><span class="e">${s.e}</span><strong>= ${G.answers[k]}</strong></button>`;
      return `<button class="card" data-k="${k}"><span class="e">${s.e}</span>문제 풀기</button>`;
    }).join("");
    const need = !allSolved ? "조각 문제를 모두 풀면 번호를 넣을 수 있어요." : !signOk ? "순서 표지판을 먼저 찾아야 해요." : "준비 완료! 표지판 순서대로 번호를 넣어요.";
    openModal(`<h2>촛불 원의 자물쇠</h2>
      <p class="lead">조각을 눌러 문제를 풀어요. 풀이하는 동안 괴물과 시간은 멈춰 있어요.</p>
      <div class="orderbox">표지판 순서 ${signOk ? `<span class="sym">${orderSyms()}</span>` : "<span>??? · 방 어딘가에 있어요</span>"}</div>
      <div class="cards">${cards}</div>
      <p class="lead" style="margin-top:12px">${need}</p>
      <div class="row"><button class="btn-ink ghost" id="lClose">닫기</button><button class="btn-ink" id="lCode" ${allSolved && signOk ? "autofocus" : "disabled"}>자물쇠 번호 넣기</button></div>`,
      e => { if (e.code === "Escape") closeLock(); });
    sheet.querySelectorAll(".card[data-k]").forEach(b => b.onclick = () => { L.view = "q"; L.pi = +b.dataset.k; L.input = ""; renderLock(); });
    $("lClose").onclick = closeLock;
    $("lCode").onclick = () => { L.view = "code"; L.code = []; renderLock(); };
  } else if (L.view === "q") {
    const p = G.pieces[L.pi], q = QBANK[G.roomIdx][p.idx], s = SYMBOLS[p.idx];
    openModal(`<h2><span style="font-family:var(--f-emoji)">${s.e}</span> ${s.name} 조각</h2>
      <p class="qtext">${esc(q.q)}</p>
      <div class="answer"><div class="slot" id="ans">${L.input}</div></div>
      ${pad()}
      ${p.wrong >= 2 ? `<div class="hint">힌트: ${esc(q.hint || "천천히 다시 읽어 보세요.")}</div>` : ""}
      <div class="row">${p.wrong >= 4 ? `<button class="btn-ink ghost" id="qReveal">정답 보기</button>` : ""}<button class="btn-ink ghost" id="qBack">뒤로</button><button class="btn-ink" id="qOk">확인</button></div>`,
      e => {
        if (/^(Digit|Numpad)\d$/.test(e.code)) { L.input = e.code.slice(-1); $("ans").textContent = L.input; }
        else if (e.code === "Backspace") { L.input = ""; $("ans").textContent = ""; }
        else if (e.code === "Enter" || e.code === "NumpadEnter") { checkAnswer(); return true; }
        else if (e.code === "Escape") { L.view = "list"; renderLock(); }
      });
    bindPad(d => { L.input = d === "x" ? "" : d; $("ans").textContent = L.input; });
    $("qBack").onclick = () => { L.view = "list"; renderLock(); };
    $("qOk").onclick = checkAnswer;
    if ($("qReveal")) $("qReveal").onclick = () => { G.stats.hints++; solvePiece(p, true); };
  } else {
    const map = G.pieces.map((p, k) => `<span><span class="e">${SYMBOLS[p.idx].e}</span> = ${G.answers[k]}</span>`).join("");
    const slots = G.order.map((idx, k) => `<div class="slot-col"><span class="e">${SYMBOLS[idx].e}</span><div class="slot">${L.code[k] ?? ""}</div></div>`).join("");
    openModal(`<h2>자물쇠 번호</h2>
      <p class="lead">표지판 순서대로, 각 기호의 숫자를 넣어요.</p>
      <div class="mapping">${map}</div>
      <div class="answer" id="codeRow">${slots}</div>
      ${pad()}
      ${L.codeWrong ? `<div class="hint">표지판 순서는 ${orderSyms()} 예요. 왼쪽 기호부터 숫자를 찾아 넣어 보세요.</div>` : ""}
      <div class="row"><button class="btn-ink ghost" id="cBack">뒤로</button></div>`,
      e => {
        if (/^(Digit|Numpad)\d$/.test(e.code)) codeDigit(e.code.slice(-1));
        else if (e.code === "Backspace") codeDigit("x");
        else if (e.code === "Escape") { L.view = "list"; renderLock(); }
      });
    bindPad(codeDigit);
    $("cBack").onclick = () => { L.view = "list"; renderLock(); };
  }
}
function pad() { return `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map(n => `<button data-d="${n}">${n}</button>`).join("")}</div><div class="pad" style="grid-template-columns:1fr;max-width:420px;margin-top:8px"><button data-d="x">⌫ 지우기</button></div>`; }
function bindPad(fn) { sheet.querySelectorAll(".pad button").forEach(b => b.onclick = () => fn(b.dataset.d)); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function checkAnswer() {
  const p = G.pieces[L.pi], q = QBANK[G.roomIdx][p.idx];
  if (L.input === "") return;
  if (+L.input === q.a) { solvePiece(p, false); return; }
  p.wrong++; Sound.wrong();
  if (p.wrong === 2) G.stats.hints++;
  L.input = ""; renderLock();
  const a = $("ans"); a.classList.add("shake");
}
function solvePiece(p) {

  $("ans").textContent = G.answers[k]; $("ans").style.borderColor = "#2f8f74";
  setTimeout(() => { if (L) { L.view = "list"; renderLock(); } }, 650);
}
function codeDigit(d) {
  if (d === "x") { L.code.pop(); renderLock(); return; }
  if (L.code.length >= G.order.length) return;
  L.code.push(d); renderLock();
  if (L.code.length === G.order.length) {
    const want = G.order.map(idx => G.answers[G.pieces.findIndex(p => p.idx === idx)]).join("");
    if (L.code.join("") === want) { setTimeout(roomClear, 350); }
    else { Sound.wrong(); L.codeWrong = true; setTimeout(() => { if (!L) return; L.code = []; renderLock(); $("codeRow").classList.add("shake"); }, 300); }
  }
}

    let q; try { q = JSON.parse($("qjson").value); } catch (e) { $("qerr").textContent = "JSON 형식이 맞지 않아요: " + e.message; return; }
    const err = validateQBank(q); if (err) { $("qerr").textContent = err; return; }
    QBANK = q; store.set("pumpkin-qbank", JSON.stringify(q)); $("qerr").textContent = "저장했어요."; setTimeout(closeModal, 600);
  };
}

/* ---------- 흐름 ---------- */
function setSeg(id, v) { $(id).querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v))); }
$("segMode").onclick = e => { const b = e.target.closest("button"); if (!b) return; G.players = +b.dataset.v; setSeg("segMode", b.dataset.v);
  $("keysHint").innerHTML = G.players === 2 ? "<kbd>W A S D</kbd> 1P · <kbd>방향키</kbd> 2P · 한 키보드로 둘이 함께" : "<kbd>W A S D</kbd> 또는 <kbd>방향키</kbd> · 바닥을 눌러도 움직여요"; };
$("segDiff").onclick = e => { const b = e.target.closest("button"); if (!b) return; G.diff = b.dataset.v; setSeg("segDiff", b.dataset.v); };
$("startBtn").onclick = () => { Sound.init(); Sound.startAmb(); startGame(); };
$("editBtn").onclick = openEditor;
$("useBell").onclick = useBell;
$("pauseBtn").onclick = openPause;
$("interact").onclick = openLock;
$("muteBtn").onclick = () => { Sound.setMuted(!Sound.muted); $("muteIcon").textContent = Sound.muted ? "🔇" : "🔊"; };
$("muteIcon").textContent = Sound.muted ? "🔇" : "🔊";

function startGame() {
  G.stats = { candy: 0, candyTotal: 0, midnights: 0, hints: 0, elapsed: 0, catches: 0 };
  G.bells = 0; G.tut = {}; G.t = 0;
  loadRoom(0);
  $("title").hidden = true; $("hud").hidden = false; $("bottom").hidden = false;
  G.mode = "cutscene";
  openModal(`<h2>할로윈 밤</h2><p class="story">${esc(PROLOGUE)}</p>
    <div class="ctl">${G.players === 2 ? "<kbd>W A S D</kbd><span>1P 이동</span><kbd>방향키</kbd><span>2P 이동</span>" : "<kbd>W A S D · 방향키</kbd><span>이동 (바닥을 눌러도 돼요)</span>"}
    <kbd>E</kbd><span>촛불 원에서 자물쇠 풀기</span></div>
    <p class="lead">조각 ${SYMBOLS.map(s => s.e).join("")}을 모으고, 순서 표지판을 찾고, 촛불 원에서 문제를 풀어요.${G.players === 2 ? " 친구가 기절하면 달려가서 닿아 주세요!" : ""}</p>
    <div class="row"><button class="btn-ink" id="pGo" autofocus>도와줄게!</button></div>`);
  const go = () => { closeModal(); G.mode = "play"; clock.getDelta(); tutorial("move", G.players === 2 ? "1P는 WASD, 2P는 방향키로 움직여요. 반짝이는 조각을 찾아보세요!" : "WASD나 방향키, 또는 바닥을 눌러 움직여요. 반짝이는 조각을 찾아보세요!"); };
  $("pGo").onclick = go;
}
function toTitle() {
  G.mode = "title"; $("title").hidden = false; $("hud").hidden = true; $("bottom").hidden = true;
  loadRoom(0); players.forEach(p => p.g.visible = false); playerLights.forEach(l => l.intensity = 0);
}

/* ---------- 루프 ---------- */
const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  if (G.mode === "play") update(dt);
  else if (G.mode === "title") { G.monsters.forEach(m => { m.anim += dt; if (!followPath(m, m.walk, dt)) pickWander(m); }); camTarget.set((G.cols - 1) / 2, 0, (G.rows - 1) / 2); }
  animate(dt, t);
  updateCamera(dt);
  renderer.render(scene, camera);
  drawDark(t);
}
toTitle();
frame();
</script>
